
services:

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_USER:     smartstock_user
      POSTGRES_PASSWORD: smartstock_pass
      POSTGRES_DB:       smartstock_db
    ports:
      - "5432:5432"        # expose so you can connect with pgAdmin if needed
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persists even if container restarts

  # FastAPI Backend
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smartstock_user:smartstock_pass@db:5432/smartstock_db
      SECRET_KEY: your-super-secret-key-change-this
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      - db               # wait for DB to start before starting backend
    volumes:
      - .:/app   # live reload — code changes reflect immediately

volumes:
  postgres_data:
